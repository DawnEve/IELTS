<script>
//-----------tools----------
//get obj
function $2(s){return document.getElementById(s)}

//获取url中的参数 https://www.cnblogs.com/vicky-li/p/9145026.html
function getUrlParam(name) {
	var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
	var r = window.location.search.substr(1).match(reg);  //匹配目标参数
	if (r != null) {
		// return unescape(r[2]);
		return decodeURIComponent(r[2]);
	}
	
	return null; //返回参数值
}


//get text from url
function getText(){
	var textURI=getUrlParam('url')
	if(textURI==null){
		alert('Please specify url parameter in the url!')
		return false;
	}
	
	// 每本小说使用独立的阅读进度
	currentBookKey = 'txtNovelReader:position:' + textURI;
	positionReady = false;

	var xmlhttp=new XMLHttpRequest(); //1.获取对象
	//2.绑定回调函数
	xmlhttp.onreadystatechange=function(){
		if (xmlhttp.readyState !== 4) return;

		if (xmlhttp.status >= 200 && xmlhttp.status < 300) {
			textBox.textContent = xmlhttp.responseText;
			restoreReadingPosition();
		} else {
			textBox.textContent =
				'Failed to load text. HTTP status: ' + xmlhttp.status;
		}
	}
	//3.设定访问的url
	xmlhttp.open("GET",textURI,true);
	//4.发送请求
	xmlhttp.send();
}




//-----------begin----------

const statusInput = document.getElementById('status');
const textBox = document.getElementById('text');
const setButton = document.getElementById('set');

const readStats = document.getElementById('readStats');

// 获取文档最大滚动距离
function getMaxScroll() {
    return Math.max(
        0,
        document.documentElement.scrollHeight - window.innerHeight
    );
}

// 更新阅读进度
function updateProgress() {
    const maxScroll = getMaxScroll();
    const scrollTop = window.scrollY || 0;

    const pct = maxScroll > 0
        ? Math.round(scrollTop / maxScroll * 100000) / 1000
        : 100;

    statusInput.value = Math.min(100, Math.max(0, pct));
}


// 跳转到指定百分比
function setTopct() {
    const value = Number(statusInput.value);

    if (statusInput.value.trim() === '' || !Number.isFinite(value)) {
        return;
    }

    const pct = Math.min(100, Math.max(0, value));
    const maxScroll = getMaxScroll();

    window.scrollTo({
        top: maxScroll * pct / 100,
        behavior: 'auto'
    });

    updateProgress(); //跳转后立即更新进度
    statusInput.value = pct.toFixed(3);
}


window.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress)

//点击set btn
setButton.addEventListener('click', setTopct);

//或者单击回车键
statusInput.addEventListener('keydown', function (evt) {
    if (evt.key === 'Enter') {
        setTopct();
    }
});






// 更新阅读统计
/*
- 行数是原文行数，不是屏幕显示行数。 比如英文句子因为屏幕窄而自动折成三行，原文仍可能只算一行。统计实际排版行数需要另外测量布局，开销也更大。
- 统计包含当前屏幕内的文字。 代码以当前视口底部作为统计位置，所以它反映的是已经滚动到并显示出来的内容，而不是视口顶部之前的内容。
*/
let statsTimer = null;

// 小屏幕不执行阅读统计
function shouldUpdateReadStats() {
	// return true; // 添加这一句正常，去掉缩放就记不住了 debug
    return window.innerWidth > 870; //设置成显示宽度小于1000，不计算行数、单词个数
}

function updateReadStats() {
	if (!shouldUpdateReadStats()) {
			return;
    }
	
    // textContent 加载完成后，正文通常是一个文本节点
    const node = textBox.firstChild;

    if (!node || node.nodeType !== Node.TEXT_NODE) {
        return;
    }

    const text = node.textContent;
    const length = text.length;

    // 统计当前视口底部对应的原文字符位置
    const targetY = window.innerHeight;
    const range = document.createRange();

    let left = 0;
    let right = length;

    // 二分查找：找到视口底部附近的字符
    while (left < right) {
        const mid = Math.floor((left + right) / 2);

        range.setStart(node, mid);
        range.setEnd(node, Math.min(mid + 1, length));

        const rect = range.getBoundingClientRect();

        if (rect.top <= targetY) {
            left = mid + 1;
        } else {
            right = mid;
        }
    }

    const pos = Math.min(left, length);
    const readText = text.slice(0, pos);

    // 原文行数：按换行符计算
    const lines = pos > 0
        ? (readText.match(/\n/g) || []).length + 1
        : 0;

    // 汉字数：统计常见中日韩统一表意文字
    const chinese = (readText.match(/\p{Script=Han}/gu) || []).length;

    // 英文单词数：支持 don't、it's 等常见缩写
    const words = (
        readText.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g) || []
    ).length;

    readStats.innerHTML =
        `Already read txt lines: ${lines.toLocaleString('en-US')} | `+
		`Characters: ${chinese.toLocaleString('en-US')} | `+
		`Words: ${words.toLocaleString('en-US')}`;
}

// 阅读统计定时任务
function scheduleReadStats() {
    clearTimeout(statsTimer);
	
	// 小屏幕不安排统计任务
    if (!shouldUpdateReadStats()) {
        return;
    }
	
    statsTimer = setTimeout(updateReadStats, 1000);
}

window.addEventListener('scroll', scheduleReadStats, { passive: true });





// 控制翻页效果: 翻页重复1行(html显示为准)
document.addEventListener('keydown', function (evt) {
    // 输入框内保留原有键盘行为
    if (evt.target.matches('input, textarea, select, button')) {
        return;
    }

    if (evt.key !== 'PageDown' && evt.key !== 'PageUp') {
        return;
    }

    evt.preventDefault();

    // 获取实际行高，兼容桌面和手机字号
    const lineHeight = parseFloat(
        getComputedStyle(textBox).lineHeight
    ) || 36;

    // 每次滚动一个视口，保留一行重叠
    const step = Math.max(1, window.innerHeight - lineHeight);

    window.scrollBy({
        top: evt.key === 'PageDown' ? step : -step,
        behavior: 'auto'
    });
});






/* ---------- 记忆每本小说的阅读位置 ---------- */

let currentBookKey = '';
let positionReady = false;
let savePositionTimer = null;

let currentReadingOffset = 0;
let resizeTimer = null;
let isResizing = false;
// 获取屏幕指定位置对应的原文字符偏移量
function getReadingOffset() {
    const node = textBox.firstChild;
    if (!node || node.nodeType !== Node.TEXT_NODE) return null;

    const textRect = textBox.getBoundingClientRect();
    const style = getComputedStyle(textBox);
    const x = textRect.left + parseFloat(style.paddingLeft) + 2;
    const y = Math.max(60, document.getElementById('topMenu')
        .getBoundingClientRect().bottom + 10);

    let range = null;

    if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(x, y);
    }

    if (!range || range.startContainer !== node) return null;
    return range.startOffset;
}

// 将指定字符恢复到视口顶部附近
function scrollToReadingOffset(pos) {
    const node = textBox.firstChild;
    if (!node || node.nodeType !== Node.TEXT_NODE) return;

    pos = Math.max(0, Math.min(pos, node.length));

    const range = document.createRange();
    let rect = null;

    // 换行符等字符可能没有有效矩形，向后寻找可见字符
    for (let i = pos; i < Math.min(pos + 500, node.length); i++) {
        range.setStart(node, i);
        range.setEnd(node, i + 1);

        const r = range.getBoundingClientRect();
        if (r.height > 0 && r.width > 0) {
            rect = r;
            break;
        }
    }

    if (rect) {
        window.scrollTo({
            top: Math.max(0, window.scrollY + rect.top - 60),
            behavior: 'auto'
        });
    }
}

// 加载小说时恢复
function restoreReadingPosition() {
    const node = textBox.firstChild;
    if (!node || node.nodeType !== Node.TEXT_NODE) return;

    try {
        currentReadingOffset =
            Number(localStorage.getItem(currentBookKey)) || 0;
    } catch (e) {
        currentReadingOffset = 0;
    }

    currentReadingOffset = Math.max(
        0, Math.min(currentReadingOffset, node.length)
    );

    positionReady = false;

    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            scrollToReadingOffset(currentReadingOffset);
            updateProgress();
            scheduleReadStats();

            // 等滚动事件处理完，再允许保存位置
            setTimeout(function () {
                positionReady = true;
            }, 100);
        });
    });
}

// 保存当前位置：内存中立即更新，localStorage 延迟写入
function saveReadingPosition() {
    if (!positionReady || isResizing || !currentBookKey) return;

    const pos = getReadingOffset();
    if (pos === null) return;

    currentReadingOffset = pos;

    clearTimeout(savePositionTimer);
    savePositionTimer = setTimeout(function () {
        try {
            localStorage.setItem(currentBookKey, String(currentReadingOffset));
        } catch (e) {}
    }, 500);
}


window.addEventListener(
    'scroll',
    saveReadingPosition,
    { passive: true }
);


window.addEventListener('resize', function () {
    if (
        !currentBookKey ||
        !textBox.firstChild ||
        textBox.firstChild.nodeType !== Node.TEXT_NODE
    ) {
        return;
    }

    // 一开始就暂停保存，避免缩放期间记录错误位置
    isResizing = true;
    positionReady = false;

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                // 按缩放前保存的字符偏移量恢复位置
                scrollToReadingOffset(currentReadingOffset);

                updateProgress();
                scheduleReadStats();

                setTimeout(function () {
                    isResizing = false;
                    positionReady = true;
                }, 100);
            });
        });
    }, 200);
});




// 初始化
window.onload=function(){
	//尝试载入文本
	getText()
}

</script>
