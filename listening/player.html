<meta charset="utf-8" />

<h1 style="background: #ff000011;">Jump to <span style="color:red">ABplayer.html</span> in 5 seconds.</h1>
<p>Please use the new page: ABplayer.html</p>
<p>2025.4 启用新页面，请使用新页面。</p>


<script>
//获取参数，5s后自动跳转到新页面
function jump(newFileName){
	const currentUrl = window.location.href;
	const newURL = currentUrl.replace("player.html", newFileName);

	console.log("newURL=", newURL)

	setTimeout(function(){
		window.location.href = newURL
	}, 5000)
};

jump("ABplayer.html")
</script>
